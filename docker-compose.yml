services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "80"
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      - TZ=America/Sao_Paulo
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
