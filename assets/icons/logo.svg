<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 160" width="680" height="160">
  <defs>
    <radialGradient id="emblemBg" cx="80" cy="60" r="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#261e15" />
      <stop offset="70%" stop-color="#120f0c" />
      <stop offset="100%" stop-color="#0a0807" />
    </radialGradient>

    <linearGradient id="goldGrad" x1="20" y1="16" x2="140" y2="144" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f6e0a6" />
      <stop offset="45%" stop-color="#d4af6e" />
      <stop offset="100%" stop-color="#9a7230" />
    </linearGradient>

    <linearGradient id="textGold" x1="170" y1="30" x2="620" y2="115" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f7e4b2" />
      <stop offset="50%" stop-color="#d4af6e" />
      <stop offset="100%" stop-color="#b48942" />
    </linearGradient>
  </defs>

  <!-- Emblema Quadrado Arredondado à Esquerda -->
  <g transform="translate(16, 16)">
    <rect width="128" height="128" rx="28" fill="url(#emblemBg)" stroke="url(#goldGrad)" stroke-width="2" />
    <rect x="6" y="6" width="116" height="116" rx="23" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" stroke-opacity="0.35" />

    <!-- Escala do ícone 512 -> 128 (0.25) -->
    <g transform="scale(0.25)">
      <!-- Raios -->
      <g stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" opacity="0.65">
        <line x1="256" y1="48" x2="256" y2="64" />
        <line x1="206" y1="62" x2="216" y2="80" />
        <line x1="306" y1="62" x2="296" y2="80" />
        <line x1="166" y1="88" x2="184" y2="104" />
        <line x1="346" y1="88" x2="328" y2="104" />
      </g>

      <!-- Cruz -->
      <path d="M248 72 H264 V104 H296 V120 H264 V190 H248 V120 H216 V104 H248 Z" fill="url(#goldGrad)" />

      <!-- Páginas -->
      <g stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
        <path d="M96 206 H204 C230 206 248 222 256 246 V398 C244 380 224 370 198 370 H96 Z" fill="#17130e" />
        <path d="M416 206 H308 C282 206 264 222 256 246 V398 C268 380 288 370 314 370 H416 Z" fill="#17130e" />
      </g>

      <!-- Caminho Central ("Via") -->
      <path d="M256 238 C246 284 222 336 196 370 H316 C290 336 266 284 256 238 Z" fill="url(#goldGrad)" fill-opacity="0.35" />

      <!-- Linhas -->
      <g stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" opacity="0.85">
        <line x1="130" y1="250" x2="208" y2="250" />
        <line x1="130" y1="286" x2="212" y2="286" />
        <line x1="130" y1="322" x2="192" y2="322" />
        <line x1="304" y1="250" x2="382" y2="250" />
        <line x1="300" y1="286" x2="382" y2="286" />
        <line x1="320" y1="322" x2="382" y2="322" />
      </g>

      <!-- Marcador -->
      <path d="M238 400 L256 446 L274 400" fill="none" stroke="url(#goldGrad)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Tipografia Editorial Horizontal -->
  <g transform="translate(168, 0)">
    <text x="0" y="88" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-size="64" font-weight="600" fill="#f5f2eb" letter-spacing="-0.5">
      Via <tspan fill="url(#textGold)" font-style="italic" font-weight="500">Scriptura</tspan>
    </text>
    <text x="4" y="118" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#a89882" letter-spacing="5.5">
      BÍBLIA SAGRADA (NAA) &amp; DEVOCIONAL DIÁRIO
    </text>
  </g>
</svg>
